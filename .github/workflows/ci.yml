name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests
      - name: Demo output is reproducible
        run: |
          bash examples/run-demo.sh > /tmp/demo-out.txt || true
          diff -u examples/expected-output.txt /tmp/demo-out.txt
